name: Deploy

permissions:
  # package job 要把 zip 发到 Releases，需要写权限；其余步骤用不到
  contents: write

on:
  # 部署只在明确要求时发生：手动触发、发 Release、或打 deploy-* 标签。
  #
  # 这里原来是 push: branches: [main]，改任何非 .md 文件（脚本、清单、workflow 本身）
  # 都会把全部账号重新部署一遍。单账号时这算"自动发布"；12 个账号时，改一行脚本
  # 等于朝 12 个目标各打一轮部署请求，既没有必要，在项目被风控时也只是反复撞同一堵墙。
  workflow_dispatch:
    inputs:
      only:
        description: "只部署这些目标（填 deploy-targets.json 里的 name，逗号分隔；留空=全部）"
        required: false
        default: ""
      delay_minutes:
        description: "相邻两个 job 之间随机等待的分钟数（0=不等待，紧接着跑下一个）"
        required: false
        default: "0"
  release:
    types: [published]
  push:
    tags:
      - "deploy-*"

# 同一时间只允许一条部署流水线，避免两次 push 交叉覆盖
concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  build:
    name: 构建与验证
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # build 要 git show 上游提交 5b2aaf0:_worker.js，兼容性测试也要完整历史
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 从上游 blob 重建并打补丁
        run: npm run build

      - name: 门禁与单测
        run: |
          npm run check
          npm test

      # 面板镜像与内嵌依赖外部站点 https://edt-pages.github.io。
      # 它不可用时会在这里失败，后面的部署不会执行，线上保留上一版。
      - name: 镜像面板并内嵌为独立版
        run: |
          npm run mirror
          npm run embed

      # compat 比对的对象是 dist/standalone/_worker.js，也就是上一步的产物。
      # 顺序不能颠倒：它曾排在上一步之前，干净环境里必然报「当前版本 的脚本不存在」，
      # 而本地因为残留 dist 反而看不出来。
      - name: 订阅地址兼容性（上游原版 A/B + 变量组合矩阵）
        run: |
          npm run compat
          npm run compat:matrix

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: worker
          path: dist/standalone/_worker.js
          retention-days: 3
          if-no-files-found: error

  # 先把目标名展开成数组，给下面的 matrix 用。
  # 单独开一个 job 是因为 matrix 只能读 needs 的 outputs，读不到 secret，
  # 而清单要么在 CF_TOKENS 里、要么在 deploy-targets.json 里。
  # 这一步只解析清单，不发任何 Cloudflare 请求。
  plan:
    name: 生成部署矩阵
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'release' ||
      startsWith(github.ref, 'refs/tags/deploy-')
    needs: build
    runs-on: ubuntu-latest
    environment: CF_TOKENS
    outputs:
      targets: ${{ steps.list.outputs.targets }}
      skip: ${{ steps.list.outputs.skip }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 列出目标
        id: list
        env:
          CF_TOKENS: ${{ secrets.CF_TOKENS }}
          ONLY: ${{ github.event.inputs.only }}
        run: |
          set -euo pipefail
          if [ -z "${CF_TOKENS:-}" ]; then
            echo "::warning::没有配置 CF_TOKENS，本次不部署。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "targets=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "${ONLY:-}" ]; then
            T=$(node scripts/deploy-all.mjs --list-json --only="$ONLY")
          else
            T=$(node scripts/deploy-all.mjs --list-json)
          fi
          echo "targets=$T" >> "$GITHUB_OUTPUT"
          echo "目标：$T"

  deploy:
    # 每个账号一个独立 job：日志、重跑、耗时都分开，
    # 一个账号失败不会把后面的人和它搅在一起（fail-fast: false）。
    name: 部署 ${{ matrix.target }}
    # 最后一道闸：即使 workflow 被别的路径触发（例如有人改了触发条件后 push），
    # 也只有手动 / Release / deploy-* 标签才真正去调 Cloudflare。
    if: needs.plan.result == 'success' && needs.plan.outputs.skip != 'true'
    needs: [build, plan]
    runs-on: ubuntu-latest
    # 一次只跑一个，前一个结束才启动下一个 —— 12 个 job 排队，不会并发打出去。
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets || '[]') }}
    # Environment secret 只有在此处声明同名 environment 时才会注入。
    # 不声明的话，即使 Settings → Environment secrets 里配了 CF_TOKENS，
    # secrets.CF_TOKENS 依然是空字符串 —— 表现为「明明配了却提示没有部署令牌」。
    # 用仓库级 secret（Settings → Secrets and variables → Actions → Repository secrets）
    # 也照样能读到：环境内没有同名 secret 时会回退到仓库级。
    environment: CF_TOKENS

    steps:
      # GitHub 没有「延迟调度」这个原语：job 只有「排队」或「并行」两种关系。
      # 要让相邻两个 job 之间隔一段时间，只能让 runner 在这段时间里空等 ——
      # 没有别的办法。默认 0 就是不等待，上一个结束立刻下一个。
      - name: 错峰等待（可选）
        env:
          DELAY: ${{ inputs.delay_minutes }}
        run: |
          set -euo pipefail
          if ! [[ "${DELAY:-0}" =~ ^[0-9]+$ ]] || [ "${DELAY:-0}" -eq 0 ]; then
            echo "delay_minutes=0，不等待，直接开始。"
            exit 0
          fi
          # 在 [0.6D, 1.4D] 之间取随机，避免每次都卡在同一个分钟数上
          BASE=$(( DELAY * 60 ))
          LOW=$(( BASE * 6 / 10 ))
          HIGH=$(( BASE * 14 / 10 ))
          WAIT=$(( LOW + RANDOM % (HIGH - LOW + 1) ))
          echo "本 job 目标：${{ matrix.target }}，等待 $((WAIT/60)) 分 $((WAIT%60)) 秒后开始"
          sleep "$WAIT"

      # 只读清单和脚本，不跑构建，所以不需要完整历史
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 每个 job 只部署一个目标，所以这一步是全局装，只算一次 npx 解析开销。
      # 装失败也不终止：脚本检测不到全局 wrangler 时会自动回退到 npx。
      - name: 安装 wrangler
        run: npm install -g wrangler@4 || echo "全局安装失败，部署时回退到 npx"

      - name: 取回构建产物
        uses: actions/download-artifact@v4
        with:
          name: worker
          path: dist/standalone

      - name: 部署 ${{ matrix.target }}
        env:
          CF_TOKENS: ${{ secrets.CF_TOKENS }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # 走环境变量而不是直接插进命令行：账号名里若有空格或引号不会破坏命令
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          node scripts/deploy-all.mjs --only="$TARGET"

  # 把构建出的独立版打成 zip 发到 Releases，方便直接从 GitHub 下载真包，
  # 不必再拖仓库里那份未内嵌面板的 _worker.js。
  package:
    name: 发布安装包到 Releases
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      # gh 命令需要在仓库目录里执行才能识别 repo
      - name: Checkout
        uses: actions/checkout@v6

      - name: 取回构建产物
        uses: actions/download-artifact@v4
        with:
          name: worker
          path: pkg

      - name: 打包
        run: |
          set -euo pipefail
          cd pkg
          zip -q -9 edgetunnel-standalone.zip _worker.js
          ls -lh edgetunnel-standalone.zip

      # 固定用 latest 这个 tag：下载地址永远是
      # https://github.com/<owner>/<repo>/releases/latest/download/edgetunnel-standalone.zip
      - name: 更新 latest Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest pkg/edgetunnel-standalone.zip \
            --title "最新构建 · ${GITHUB_SHA:0:7}" \
            --notes "由 commit ${GITHUB_SHA:0:7} 自动构建。包内根目录一个 \`_worker.js\`（面板已内嵌），拖进 Cloudflare Pages 的 Create deployment 即可。" \
            --latest
