name: Deploy

permissions:
  # package job 要把 zip 发到 Releases，需要写权限；其余步骤用不到
  contents: write

on:
  # 部署只在明确要求时发生：手动触发、发 Release、或打 deploy-* 标签。
  #
  # 这里原来是 push: branches: [main]，改任何非 .md 文件（脚本、清单、workflow 本身）
  # 都会把全部账号重新部署一遍。单账号时这算"自动发布"；12 个账号时，改一行脚本
  # 等于朝 12 个目标各打一轮部署请求，既没有必要，在项目被风控时也只是反复撞同一堵墙。
  workflow_dispatch:
    inputs:
      only:
        description: "只部署这些目标（填 deploy-targets.json 里的 name，逗号分隔；留空=全部）"
        required: false
        default: ""
  release:
    types: [published]
  push:
    tags:
      - "deploy-*"

# 同一时间只允许一条部署流水线，避免两次 push 交叉覆盖
concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  build:
    name: 构建与验证
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # build 要 git show 上游提交 5b2aaf0:_worker.js，兼容性测试也要完整历史
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 从上游 blob 重建并打补丁
        run: npm run build

      - name: 门禁与单测
        run: |
          npm run check
          npm test

      # 面板镜像与内嵌依赖外部站点 https://edt-pages.github.io。
      # 它不可用时会在这里失败，后面的部署不会执行，线上保留上一版。
      - name: 镜像面板并内嵌为独立版
        run: |
          npm run mirror
          npm run embed

      # compat 比对的对象是 dist/standalone/_worker.js，也就是上一步的产物。
      # 顺序不能颠倒：它曾排在上一步之前，干净环境里必然报「当前版本 的脚本不存在」，
      # 而本地因为残留 dist 反而看不出来。
      - name: 订阅地址兼容性（上游原版 A/B + 变量组合矩阵）
        run: |
          npm run compat
          npm run compat:matrix

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: worker
          path: dist/standalone/_worker.js
          retention-days: 3
          if-no-files-found: error

  deploy:
    name: 部署到 Cloudflare Pages
    # 最后一道闸：即使 workflow 被别的路径触发（例如有人改了触发条件后 push），
    # 也只有手动 / Release / deploy-* 标签才真正去调 Cloudflare。
    # 其余情况整个 job 直接跳过，一个部署请求都不会发出去。
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'release' ||
      startsWith(github.ref, 'refs/tags/deploy-')
    needs: build
    runs-on: ubuntu-latest
    # Environment secret 只有在此处声明同名 environment 时才会注入。
    # 不声明的话，即使 Settings → Environment secrets 里配了 CF_TOKENS，
    # secrets.CF_TOKENS 依然是空字符串 —— 表现为「明明配了却提示没有部署令牌」。
    # 用仓库级 secret（Settings → Secrets and variables → Actions → Repository secrets）
    # 也照样能读到：环境内没有同名 secret 时会回退到仓库级。
    environment: CF_TOKENS

    steps:
      # 只读清单和脚本，不跑构建，所以不需要完整历史
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 全局装一次，多账号部署时不必每个都走 npx 解析。
      # 装失败也不终止：脚本检测不到全局 wrangler 时会自动回退到 npx。
      - name: 安装 wrangler
        run: npm install -g wrangler@4 || echo "全局安装失败，部署时回退到 npx"

      - name: 取回构建产物
        uses: actions/download-artifact@v4
        with:
          name: worker
          path: dist/standalone

      - name: 校验部署清单
        id: check
        env:
          CF_TOKENS: ${{ secrets.CF_TOKENS }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CF_TOKENS:-}" ] && [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::warning::还没有配置部署令牌，本次只构建不部署。到 Settings → Secrets and variables → Actions 添加 CF_TOKENS（一个 JSON 装全部账号），然后重新运行本工作流即可。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/deploy-all.mjs --dry-run --skip-missing

      - name: 部署
        if: steps.check.outputs.skip != 'true'
        env:
          CF_TOKENS: ${{ secrets.CF_TOKENS }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ONLY: ${{ github.event.inputs.only }}
        run: |
          set -euo pipefail
          if [ -n "${ONLY:-}" ]; then
            node scripts/deploy-all.mjs --skip-missing --only="$ONLY"
          else
            node scripts/deploy-all.mjs --skip-missing
          fi

  # 把构建出的独立版打成 zip 发到 Releases，方便直接从 GitHub 下载真包，
  # 不必再拖仓库里那份未内嵌面板的 _worker.js。
  package:
    name: 发布安装包到 Releases
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      # gh 命令需要在仓库目录里执行才能识别 repo
      - name: Checkout
        uses: actions/checkout@v6

      - name: 取回构建产物
        uses: actions/download-artifact@v4
        with:
          name: worker
          path: pkg

      - name: 打包
        run: |
          set -euo pipefail
          cd pkg
          zip -q -9 edgetunnel-standalone.zip _worker.js
          ls -lh edgetunnel-standalone.zip

      # 固定用 latest 这个 tag：下载地址永远是
      # https://github.com/<owner>/<repo>/releases/latest/download/edgetunnel-standalone.zip
      - name: 更新 latest Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest pkg/edgetunnel-standalone.zip \
            --title "最新构建 · ${GITHUB_SHA:0:7}" \
            --notes "由 commit ${GITHUB_SHA:0:7} 自动构建。包内根目录一个 \`_worker.js\`（面板已内嵌），拖进 Cloudflare Pages 的 Create deployment 即可。" \
            --latest
