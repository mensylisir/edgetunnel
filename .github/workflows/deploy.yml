name: Deploy

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  workflow_dispatch:
    inputs:
      only:
        description: "只部署这些目标（填 deploy-targets.json 里的 name，逗号分隔；留空=全部）"
        required: false
        default: ""

# 同一时间只允许一条部署流水线，避免两次 push 交叉覆盖
concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  build:
    name: 构建与验证
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # build 要 git show 上游提交 5b2aaf0:_worker.js，兼容性测试也要完整历史
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 从上游 blob 重建并打补丁
        run: npm run build

      - name: 门禁与单测
        run: |
          npm run check
          npm test

      - name: 订阅地址兼容性（上游原版 A/B + 变量组合矩阵）
        run: |
          npm run compat
          npm run compat:matrix

      # 面板镜像与内嵌依赖外部站点 https://edt-pages.github.io。
      # 它不可用时会在这里失败，后面的部署不会执行，线上保留上一版。
      - name: 镜像面板并内嵌为独立版
        run: |
          npm run mirror
          npm run embed

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: worker
          path: dist/standalone/_worker.js
          retention-days: 3
          if-no-files-found: error

  deploy:
    name: 部署到 Cloudflare Pages
    needs: build
    runs-on: ubuntu-latest

    steps:
      # 只读清单和脚本，不跑构建，所以不需要完整历史
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 全局装一次，多账号部署时不必每个都走 npx 解析。
      # 装失败也不终止：脚本检测不到全局 wrangler 时会自动回退到 npx。
      - name: 安装 wrangler
        run: npm install -g wrangler@4 || echo "全局安装失败，部署时回退到 npx"

      - name: 取回构建产物
        uses: actions/download-artifact@v4
        with:
          name: worker
          path: dist/standalone

      - name: 校验部署清单
        env:
          CF_TOKENS: ${{ secrets.CF_TOKENS }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CF_TOKENS:-}" ] && [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::没有可用令牌。Settings → Secrets and variables → Actions 里添加 CF_TOKENS（推荐，一个 JSON 装全部账号），或只配单账号用的 CLOUDFLARE_API_TOKEN。详见 FORK-NOTES「一次更新多个账号」"
            exit 1
          fi
          node scripts/deploy-all.mjs --dry-run --skip-missing

      - name: 部署
        env:
          CF_TOKENS: ${{ secrets.CF_TOKENS }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ONLY: ${{ github.event.inputs.only }}
        run: |
          set -euo pipefail
          if [ -n "${ONLY:-}" ]; then
            node scripts/deploy-all.mjs --skip-missing --only="$ONLY"
          else
            node scripts/deploy-all.mjs --skip-missing
          fi
